name: Codex Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  codex-review:
    name: Review pull request with Codex
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false
    permissions:
      contents: read
    outputs:
      final_message: ${{ steps.run_codex.outputs.final-message }}
      codex_outcome: ${{ steps.run_codex.outcome }}
      secret_present: ${{ steps.secret_check.outputs.present }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: refs/pull/${{ github.event.pull_request.number }}/merge

      - name: Fetch pull request refs
        env:
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          git fetch --no-tags origin \
            "$PR_BASE_REF" \
            "+refs/pull/$PR_NUMBER/head"

      - name: Check OpenAI API key presence
        id: secret_check
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -n "$OPENAI_API_KEY" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Ask Codex for a PR review
        id: run_codex
        continue-on-error: true
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          allow-users: ryota-nakazawa
          prompt: |
            これは ${{ github.repository }} の PR #${{ github.event.pull_request.number }} です。

            PRで入った変更だけをレビューしてください:
            - Base SHA: ${{ github.event.pull_request.base.sha }}
            - Head SHA: ${{ github.event.pull_request.head.sha }}

            必要なら次のコマンドを使って差分とテストを確認してください:
            - git diff --stat ${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}
            - git diff ${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}
            - npm test

            目的:
            - バグ、振る舞いの退行、セキュリティリスク、テスト不足を見つける。
            - 一般論ではなく、このPRの差分に基づく具体的な指摘を優先する。

            リポジトリ情報:
            - Node.js標準モジュールだけで動くアプリ。
            - 主なテストコマンド: npm test
            - 画面コード: public/
            - サーバー/APIコード: server/
            - テスト: test/

            ルール:
            - 依存関係をインストールしない。
            - ファイルを変更しない。
            - レビュー結果、見出し、本文は日本語で書く。
            - 簡潔で、次に取るべき対応が分かるレビューにする。
            - 問題がない場合は明確に「重大な問題は見つかりません」と書き、残るテストリスクだけを短く述べる。

            出力形式:
            - 先頭行に必ず `ISSUE_NEEDED: yes` または `ISSUE_NEEDED: no` を書く。
            - 対応が必要な具体的な問題が1つ以上ある場合だけ `ISSUE_NEEDED: yes` にする。
            - 2行目に `ISSUE_TITLE: ...` を書く。Issue不要なら `ISSUE_TITLE: none` にする。
            - その後に短い判定を書く。
            - 指摘がある場合は重要度順に並べ、可能な限りファイルパスと行番号を含める。
            - Issue化されても意味が通じるように、原因、影響、推奨対応を書く。

  post-feedback:
    name: Post Codex review feedback
    runs-on: ubuntu-latest
    needs: codex-review
    if: always() && needs.codex-review.result != 'cancelled'
    permissions:
      issues: write
      pull-requests: write

    steps:
      - name: Comment on pull request
        uses: actions/github-script@v7
        env:
          CODEX_FINAL_MESSAGE: ${{ needs.codex-review.outputs.final_message }}
          CODEX_OUTCOME: ${{ needs.codex-review.outputs.codex_outcome }}
          SECRET_PRESENT: ${{ needs.codex-review.outputs.secret_present }}
        with:
          github-token: ${{ github.token }}
          script: |
            const finalMessage = process.env.CODEX_FINAL_MESSAGE;
            const body = finalMessage && finalMessage.trim()
              ? `## Codexレビュー\n\n${finalMessage}`
              : [
                  '## Codexレビュー',
                  '',
                  'Codex Action からレビュー結果が返りませんでした。',
                  '',
                  `- Codexステップの実行結果: ${process.env.CODEX_OUTCOME || 'unknown'}`,
                  `- OPENAI_API_KEY設定済み: ${process.env.SECRET_PRESENT || 'unknown'}`,
                  '',
                  '詳細はこの実行のActionsログを確認してください。',
                ].join('\n');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body,
            });

      - name: Create or update issue for actionable findings
        if: "${{ contains(needs.codex-review.outputs.final_message, 'ISSUE_NEEDED: yes') }}"
        uses: actions/github-script@v7
        env:
          CODEX_FINAL_MESSAGE: ${{ needs.codex-review.outputs.final_message }}
        with:
          github-token: ${{ github.token }}
          script: |
            const finalMessage = process.env.CODEX_FINAL_MESSAGE || '';
            const pr = context.payload.pull_request;
            const issueTitleMatch = finalMessage.match(/^ISSUE_TITLE:\s*(.+)$/m);
            const rawIssueTitle = issueTitleMatch ? issueTitleMatch[1].trim() : '';
            const issueTitle = rawIssueTitle && rawIssueTitle.toLowerCase() !== 'none'
              ? `[Codex Review] PR #${pr.number}: ${rawIssueTitle}`
              : `[Codex Review] PR #${pr.number}: 対応が必要なレビュー指摘`;

            const issueBody = [
              `Codexレビューで、対応が必要そうな問題が見つかりました。`,
              '',
              `対象PR: ${pr.html_url}`,
              `PRタイトル: ${pr.title}`,
              `Head: ${pr.head.ref} (${pr.head.sha})`,
              '',
              '## Codexレビュー結果',
              '',
              finalMessage,
            ].join('\n');

            try {
              await github.rest.issues.createLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: 'codex-review',
                color: '005bac',
                description: 'Created from Codex review findings',
              });
            } catch (error) {
              if (error.status !== 422) throw error;
            }

            const existingIssues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'all',
              labels: 'codex-review',
              per_page: 100,
            });
            const existing = existingIssues.find((issue) =>
              !issue.pull_request && issue.title.startsWith(`[Codex Review] PR #${pr.number}:`)
            );

            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body: [
                  `PR #${pr.number} の更新に伴い、Codexレビュー結果を追記します。`,
                  '',
                  pr.html_url,
                  '',
                  finalMessage,
                ].join('\n'),
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: issueTitle,
                body: issueBody,
                labels: ['codex-review'],
              });
            }
