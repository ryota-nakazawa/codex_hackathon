<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>予約フォーム | Dental Clinic PoC</title>
    <meta name="description" content="歯科医院の患者向け予約フォーム" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body class="page page-reserve">
    <div class="page-shell">
      <header class="marketing-header">
        <a class="brand" href="/">
          <span class="brand-mark">DC</span>
          <span>
            <strong>Dental Clinic PoC</strong>
            <small>患者向け予約導線</small>
          </span>
        </a>
        <nav class="header-nav" aria-label="主な画面">
          <a href="/">医院サイト</a>
          <a href="/reserve" aria-current="page">予約フォーム</a>
          <a href="/dashboard">管理画面</a>
        </nav>
      </header>

      <main class="reserve-main">
        <section class="hero-panel">
          <div class="section-label">患者の予約フォーム</div>
          <h1>来院予約の入力</h1>
          <p class="lead">
            初診・再診、希望日時、症状を入力して送信します。送信後は同じ画面で受付結果を確認できます。
          </p>
          <div class="mini-panel" id="reserveStatusCard"></div>
          <ul class="bullet-list" id="reservationHints"></ul>
        </section>

        <section class="panel form-panel">
          <div class="panel-head">
            <div>
              <div class="section-label">入力項目</div>
              <h2>予約情報</h2>
            </div>
          </div>
          <form id="appointmentForm" class="form-grid">
            <div class="two-column">
              <label>
                <span>氏名</span>
                <input name="name" type="text" placeholder="例: 青木 さやか" required />
              </label>
              <label>
                <span>ふりがな</span>
                <input name="kana" type="text" placeholder="あおき さやか" />
              </label>
            </div>

            <div class="two-column">
              <label>
                <span>電話番号</span>
                <input name="phone" type="tel" placeholder="090-1234-5678" required />
              </label>
              <label>
                <span>受診区分</span>
                <select name="visitType">
                  <option value="初診">初診</option>
                  <option value="再診">再診</option>
                </select>
              </label>
            </div>

            <div class="two-column">
              <label>
                <span>希望日</span>
                <input name="date" type="date" required />
              </label>
              <label>
                <span>希望時間</span>
                <select name="time" required></select>
              </label>
            </div>

            <label>
              <span>症状・相談内容</span>
              <textarea name="notes" rows="5" placeholder="例: 右上の奥歯がしみる。痛みの原因を相談したい。"></textarea>
            </label>

            <div class="button-row">
              <button class="primary-button" type="submit">予約を送信</button>
              <button class="secondary-button" id="resetAppointmentForm" type="button">入力をクリア</button>
            </div>
          </form>
        </section>

        <section class="panel">
          <div class="panel-head">
            <div>
              <div class="section-label">送信結果</div>
              <h2>受付状況</h2>
            </div>
          </div>
          <div class="message info" id="appointmentFeedback">
            予約を送信すると、この欄に受付結果が表示されます。
          </div>
          <div class="info-grid" id="appointmentSummary"></div>
          <div class="button-row">
            <a class="secondary-button" href="/">医院サイトへ戻る</a>
            <a class="primary-button" href="/dashboard">予約一覧を見る</a>
          </div>
        </section>
      </main>
    </div>
    <script type="module" src="/reserve.js"></script>
  </body>
</html>
