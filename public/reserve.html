<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>予約フォーム | Dental Clinic PoC</title>
    <meta name="description" content="歯科医院の患者向け予約フォーム" />
    <link rel="stylesheet" href="/styles.css" />
    <link rel="stylesheet" href="/reserve-page.css" />
  </head>
  <body class="page page-reserve">
    <div class="page-shell">
      <header class="marketing-header">
        <a class="brand" href="/">
          <span class="brand-mark">AO</span>
          <span>
            <strong id="clinicName">あおば歯科クリニック</strong>
            <small id="clinicSubline">患者向け予約導線</small>
          </span>
        </a>
        <nav class="header-nav" aria-label="主な画面">
          <a href="/">医院サイト</a>
          <a href="/reserve" aria-current="page">予約フォーム</a>
          <a href="/dashboard">管理画面</a>
        </nav>
      </header>

      <main class="reserve-main">
        <section class="hero-panel reserve-hero">
          <div class="hero-copy">
            <div class="section-label">患者の予約フォーム</div>
            <h1>来院予約の入力</h1>
            <p class="lead">
              空き枠を先に確認して、選んだ時間をそのまま予約できます。1診療60分の予約枠で整理しています。
            </p>
            <div class="reserve-badges">
              <span class="reserve-chip">1診療60分</span>
              <span class="reserve-chip">空き枠から選択</span>
              <span class="reserve-chip">WEB送信で完了</span>
            </div>
          </div>
          <aside class="hero-side-card reserve-policy-card" id="reservePolicyCard"></aside>
        </section>

        <section class="panel availability-panel">
          <div class="panel-head">
            <div>
              <div class="section-label">空き枠</div>
              <h2>予約できる時間を選ぶ</h2>
            </div>
            <div class="availability-meta" id="availabilityMeta"></div>
          </div>
          <div class="reserve-day-strip" id="dayTabs"></div>
          <div class="reserve-slot-grid" id="slotGrid"></div>
          <div class="reserve-slot-footer" id="selectedSlotSummary"></div>
        </section>

        <section class="panel form-panel">
          <div class="panel-head">
            <div>
              <div class="section-label">入力項目</div>
              <h2>予約情報</h2>
            </div>
          </div>
          <form id="appointmentForm" class="form-grid reserve-form">
            <input type="hidden" name="date" />
            <input type="hidden" name="time" />
            <div class="two-column">
              <label>
                <span>氏名</span>
                <input name="name" type="text" placeholder="例: 青木 さやか" required />
              </label>
              <label>
                <span>ふりがな</span>
                <input name="kana" type="text" placeholder="あおき さやか" />
              </label>
            </div>

            <div class="two-column">
              <label>
                <span>電話番号</span>
                <input name="phone" type="tel" placeholder="090-1234-5678" required />
              </label>
              <label>
                <span>受診区分</span>
                <select name="visitType">
                  <option value="初診">初診</option>
                  <option value="再診">再診</option>
                </select>
              </label>
            </div>

            <div class="two-column">
              <label>
                <span>主訴</span>
                <input name="chiefComplaint" type="text" placeholder="例: 右上の奥歯がしみる" required />
              </label>
              <label>
                <span>気になる部位</span>
                <input name="concernArea" type="text" placeholder="例: 右上臼歯部 / 親知らず周囲" required />
              </label>
            </div>

            <label>
              <span>今回の希望</span>
              <input name="patientRequest" type="text" placeholder="例: 痛みの原因を知りたい / 必要な処置を知りたい" />
            </label>

            <label>
              <span>症状・相談内容</span>
              <textarea name="notes" rows="5" placeholder="例: 右上の奥歯がしみる。痛みの原因を相談したい。"></textarea>
            </label>

            <div class="button-row">
              <button class="primary-button" type="submit">選択した空き枠で予約を送信</button>
              <button class="secondary-button" id="resetAppointmentForm" type="button">選択をやり直す</button>
            </div>

            <div class="message info" id="appointmentFeedback">
              空き枠を選んで送信すると、この場で予約結果を確認できます。
            </div>
            <div class="info-grid" id="appointmentSummary"></div>
            <div class="button-row">
              <a class="secondary-button" href="/">医院サイトへ戻る</a>
            </div>
          </form>
        </section>
      </main>
    </div>
    <script type="module" src="/reserve.js"></script>
  </body>
</html>
