<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>患者詳細 | Dental Clinic PoC</title>
    <meta name="description" content="歯科医院の患者詳細画面" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body class="page page-patient">
    <div class="page-shell">
      <header class="app-header clinical-header">
        <div class="brand">
          <span class="brand-mark">DC</span>
          <span>
            <strong>Dental Clinic PoC</strong>
            <small>患者詳細</small>
          </span>
        </div>
        <nav class="header-nav" aria-label="主な画面">
          <a href="/dashboard">予約一覧</a>
          <a href="/reserve">予約フォーム</a>
          <a href="/">医院サイト</a>
        </nav>
      </header>

      <main class="patient-main">
        <section class="page-summary patient-summary">
          <div>
            <div class="section-label dark">患者詳細画面</div>
            <h1 id="patientTitle">患者詳細</h1>
            <p class="lead" id="patientLead"></p>
          </div>
          <div class="button-row">
            <a class="secondary-button" href="/dashboard">予約一覧へ戻る</a>
          </div>
        </section>

        <section class="patient-grid">
          <article class="panel clinical-panel">
            <div class="panel-head">
              <div>
                <div class="section-label dark">基本情報</div>
                <h2>患者プロフィール</h2>
              </div>
            </div>
            <div class="info-grid" id="patientProfile"></div>
          </article>

          <article class="panel clinical-panel">
            <div class="panel-head">
              <div>
                <div class="section-label dark">予約履歴</div>
                <h2>予約と来院の流れ</h2>
              </div>
            </div>
            <div class="stack-grid" id="patientAppointments"></div>
          </article>
        </section>

        <section class="patient-grid">
          <article class="panel clinical-panel">
            <div class="panel-head">
              <div>
                <div class="section-label dark">過去履歴</div>
                <h2>診断補助レポート</h2>
              </div>
            </div>
            <div class="stack-grid" id="patientReports"></div>
          </article>

          <article class="panel clinical-panel">
            <div class="panel-head">
              <div>
                <div class="section-label dark">画像情報</div>
                <h2>レントゲンメタ情報</h2>
              </div>
            </div>
            <div class="stack-grid" id="patientXrays"></div>
          </article>
        </section>

        <section class="panel clinical-panel">
          <div class="panel-head">
            <div>
              <div class="section-label dark">新規記録</div>
              <h2>この患者の記録を追加する</h2>
            </div>
          </div>
          <form id="patientReportForm" class="form-grid">
            <label>
              <span>タイトル</span>
              <input name="title" type="text" placeholder="例: 次回来院前の確認事項" required />
            </label>
            <label>
              <span>本文</span>
              <textarea name="body" rows="5" placeholder="症状の変化や次回の確認ポイントを入力"></textarea>
            </label>
            <div class="button-row">
              <button class="primary-button" type="submit">記録を追加</button>
            </div>
          </form>
          <div id="patientReportFeedback" class="message info">追加した記録は、この患者の履歴に反映されます。</div>
        </section>

        <section class="panel clinical-panel">
          <div class="panel-head">
            <div>
              <div class="section-label dark">レントゲンAI解析</div>
              <h2>画像をアップロードして解析する</h2>
            </div>
          </div>
          <form id="xrayAnalysisForm" class="form-grid">
            <label>
              <span>レントゲン画像</span>
              <input name="xrayImage" type="file" accept="image/png,image/jpeg,image/webp" required />
            </label>
            <div class="two-column">
              <label>
                <span>撮影部位</span>
                <input name="bodyPart" type="text" placeholder="例: 右上臼歯部" />
              </label>
              <label>
                <span>撮影方向</span>
                <input name="view" type="text" placeholder="例: デンタル / パノラマ" />
              </label>
            </div>
            <label>
              <span>所見メモ</span>
              <textarea name="notes" rows="4" placeholder="例: 冷水痛と咬合時違和感がある。修復物周囲を確認したい。"></textarea>
            </label>
            <div class="button-row">
              <button class="primary-button" type="submit">AI解析して保存</button>
            </div>
          </form>
          <div id="xrayAnalysisFeedback" class="message info">画像を選ぶと、そのままAI解析レポートを生成して患者履歴へ反映します。</div>
          <div class="stack-grid" id="xrayAnalysisResult"></div>
        </section>
      </main>
    </div>
    <script type="module" src="/patient.js"></script>
  </body>
</html>
